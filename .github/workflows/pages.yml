# Publie le dossier public/ sur GitHub Pages à chaque envoi sur la branche principale.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Chaque publication donne une adresse nouvelle aux fichiers du site, pour que Safari
      # ne mélange jamais des fichiers anciens (gardés en cache) et nouveaux.
      - name: Numéroter les fichiers
        run: |
          V=${GITHUB_SHA::7}
          sed -i -E "s#(from '\./[a-z-]+\.js)'#\1?v=$V'#g" public/js/*.js
          sed -i -e "s#href=\"styles.css\"#href=\"styles.css?v=$V\"#" -e "s#src=\"js/app.js\"#src=\"js/app.js?v=$V\"#" public/index.html
          sed -i "s/VERSION = 'dev'/VERSION = '$V'/" public/js/version.js
          echo "{\"version\":\"$V\"}" > public/version.json
          grep -c "?v=$V" public/index.html public/js/app.js
          grep -c "$V" public/js/version.js public/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploiement
        uses: actions/deploy-pages@v4
