# Publie le dossier public/ sur GitLab Pages à chaque envoi sur la branche principale.
# Pour garder la page privée : Paramètres > Général > Visibilité > Pages = « Membres du projet uniquement ».
pages:
  image: alpine:latest
  script:
    - echo "Site statique, rien à construire."
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
